<svg width="100%" viewBox="0 0 810 510" role="img" xmlns="http://www.w3.org/2000/svg" style="max-width: 810px; display: block; margin-inline: auto;">
  <title>Swiss Cheese Model — Intelligent Teaching Assistant</title>
  <desc>Four layered defence slices showing how an active failure / attack is blocked before reaching system failure.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#9b9b9b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <clipPath id="clip1"><polygon points="570,108 620,128 620,388 570,368"/></clipPath>
    <clipPath id="clip2"><polygon points="456,108 506,128 506,388 456,368"/></clipPath>
    <clipPath id="clip3"><polygon points="342,108 392,128 392,388 342,368"/></clipPath>
    <clipPath id="clip4"><polygon points="228,108 278,128 278,388 228,368"/></clipPath>
  </defs>

  <rect x="0" y="0" width="810" height="510" fill="transparent"/>

  <!-- Principles -->
  <text x="32" y="26" font-family="sans-serif" font-size="12" fill="#5a7fa8" font-weight="600">Principles</text>
  <circle cx="39" cy="41" r="2.5" fill="#5a7fa8"/>
  <text x="48" y="45" font-family="sans-serif" font-size="12" fill="#4a6e96">Add more layers of defence</text>
  <circle cx="39" cy="58" r="2.5" fill="#5a7fa8"/>
  <text x="48" y="62" font-family="sans-serif" font-size="12" fill="#4a6e96">Make the defences different (so the holes don't line up)</text>
  <circle cx="39" cy="75" r="2.5" fill="#5a7fa8"/>
  <text x="48" y="79" font-family="sans-serif" font-size="12" fill="#4a6e96">Reduce the number of holes</text>

  <!-- Sociotechnical bracket -->
  <path d="M234,96 L220,96 L220,380 L234,380" fill="none" stroke="#7bb3d4" stroke-width="1.2" stroke-linecap="round"/>
  <text x="208" y="240" font-family="sans-serif" font-size="11" fill="#5a8ab0" font-weight="600" text-anchor="middle" transform="rotate(-90,208,240)">Sociotechnical defences</text>

  <!-- Technical bracket -->
  <path d="M620,96 L636,96 L636,380 L620,380" fill="none" stroke="#3d7db8" stroke-width="1.2" stroke-linecap="round"/>
  <text x="648" y="240" font-family="sans-serif" font-size="11" fill="#2e6699" font-weight="600" text-anchor="middle" transform="rotate(90,648,240)">Technical defences</text>

  <!-- Slice 4 -->
  <polygon points="228,108 278,128 278,388 228,368" fill="#4a90b8" stroke="#3278a0" stroke-width="0.8"/>
  <circle cx="243" cy="168" r="14" fill="white" opacity="0.85" clip-path="url(#clip4)"/>
  <circle cx="263" cy="280" r="10" fill="white" opacity="0.85" clip-path="url(#clip4)"/>
  <circle cx="248" cy="335" r="8" fill="white" opacity="0.85" clip-path="url(#clip4)"/>
  <circle cx="270" cy="208" r="7" fill="white" opacity="0.85" clip-path="url(#clip4)"/>
  <text x="253" y="430" font-family="sans-serif" font-size="10.5" fill="#2c6484" text-anchor="middle" font-weight="600">Post-incident</text>
  <text x="253" y="444" font-family="sans-serif" font-size="10.5" fill="#2c6484" text-anchor="middle" font-weight="600">review</text>
  <text x="253" y="460" font-family="sans-serif" font-size="9.5" fill="#5a8aaa" text-anchor="middle">(Sociotechnical)</text>

  <!-- Slice 3 -->
  <polygon points="342,108 392,128 392,388 342,368" fill="#62a8cc" stroke="#4a90b8" stroke-width="0.8"/>
  <circle cx="360" cy="195" r="11" fill="white" opacity="0.85" clip-path="url(#clip3)"/>
  <circle cx="378" cy="150" r="8" fill="white" opacity="0.85" clip-path="url(#clip3)"/>
  <circle cx="355" cy="310" r="13" fill="white" opacity="0.85" clip-path="url(#clip3)"/>
  <circle cx="375" cy="355" r="7" fill="white" opacity="0.85" clip-path="url(#clip3)"/>
  <circle cx="362" cy="252" r="6" fill="white" opacity="0.85" clip-path="url(#clip3)"/>
  <text x="367" y="430" font-family="sans-serif" font-size="10.5" fill="#2c6484" text-anchor="middle" font-weight="600">On-call engineer</text>
  <text x="367" y="444" font-family="sans-serif" font-size="10.5" fill="#2c6484" text-anchor="middle" font-weight="600">+ alarms</text>
  <text x="367" y="460" font-family="sans-serif" font-size="9.5" fill="#5a8aaa" text-anchor="middle">(Sociotechnical)</text>

  <!-- Slice 2 -->
  <polygon points="456,108 506,128 506,388 456,368" fill="#85c4de" stroke="#62a8cc" stroke-width="0.8"/>
  <circle cx="474" cy="175" r="9" fill="white" opacity="0.85" clip-path="url(#clip2)"/>
  <circle cx="491" cy="240" r="12" fill="white" opacity="0.85" clip-path="url(#clip2)"/>
  <circle cx="469" cy="320" r="8" fill="white" opacity="0.85" clip-path="url(#clip2)"/>
  <circle cx="496" cy="155" r="6" fill="white" opacity="0.85" clip-path="url(#clip2)"/>
  <circle cx="480" cy="370" r="10" fill="white" opacity="0.85" clip-path="url(#clip2)"/>
  <text x="481" y="430" font-family="sans-serif" font-size="10.5" fill="#2c6484" text-anchor="middle" font-weight="600">Circuit breaker</text>
  <text x="481" y="444" font-family="sans-serif" font-size="10.5" fill="#2c6484" text-anchor="middle" font-weight="600">+ health probes</text>
  <text x="481" y="460" font-family="sans-serif" font-size="9.5" fill="#5a8aaa" text-anchor="middle">(Technical)</text>

  <!-- Slice 1 -->
  <polygon points="570,108 620,128 620,388 570,368" fill="#aedcee" stroke="#85c4de" stroke-width="0.8"/>
  <circle cx="588" cy="162" r="10" fill="white" opacity="0.85" clip-path="url(#clip1)"/>
  <circle cx="608" cy="290" r="9" fill="white" opacity="0.85" clip-path="url(#clip1)"/>
  <circle cx="584" cy="355" r="13" fill="white" opacity="0.85" clip-path="url(#clip1)"/>
  <circle cx="610" cy="210" r="7" fill="white" opacity="0.85" clip-path="url(#clip1)"/>
  <text x="595" y="430" font-family="sans-serif" font-size="10.5" fill="#2c6484" text-anchor="middle" font-weight="600">Authentication</text>
  <text x="595" y="444" font-family="sans-serif" font-size="10.5" fill="#2c6484" text-anchor="middle" font-weight="600">+ input validation</text>
  <text x="595" y="460" font-family="sans-serif" font-size="9.5" fill="#5a8aaa" text-anchor="middle">(Technical)</text>

  <!-- Attack arrow -->
  <path d="M 720,115 L 622,150 L 510,230 L 396,185 L 280,248" fill="none" stroke="#d63d2a" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)" opacity="0.92"/>
  <text x="728" y="112" font-family="sans-serif" font-size="11" fill="#d63d2a" font-weight="700" text-anchor="start">Active failure</text>
  <text x="728" y="127" font-family="sans-serif" font-size="11" fill="#d63d2a" font-weight="700" text-anchor="start">/ Attack</text>

  <!-- Block X -->
  <line x1="265" y1="235" x2="277" y2="260" stroke="#d63d2a" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="277" y1="235" x2="265" y2="260" stroke="#d63d2a" stroke-width="2.2" stroke-linecap="round"/>

  <!-- System failure ghost arrow -->
  <path d="M 228,368 L 150,410" fill="none" stroke="#9b9b9b" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow-gray)" opacity="0.6"/>
  <text x="145" y="425" font-family="sans-serif" font-size="10" fill="#888" text-anchor="end">System failure</text>
  <text x="145" y="438" font-family="sans-serif" font-size="10" fill="#888" text-anchor="end">(blocked)</text>

  <!-- Caption -->
  <text x="400" y="486" font-family="sans-serif" font-size="11" fill="#5a7a9a" text-anchor="middle" font-style="italic">Latent conditions in defensive layers — Intelligent Teaching Assistant</text>
</svg>
